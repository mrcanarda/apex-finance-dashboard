services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - apex

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/apex-finance
      JWT_SECRET: docker-dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - apex

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    networks:
      - apex

networks:
  apex:
    driver: bridge

volumes:
  mongo_data:
