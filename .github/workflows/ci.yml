name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (frontend + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: ESLint (frontend)
        run: npm run lint
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: ESLint (server)
        working-directory: server
        run: npm run lint

  test:
    name: Test (server + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Jest
        working-directory: server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/apex-finance-test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: npm test

  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install & build
        run: npm ci && npm run build
